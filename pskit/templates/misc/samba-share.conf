# Managed by pskit (optional file share module).
# smbd listens on all interfaces, like sshd: binding to the tailnet address
# at boot can create an ordering cycle with the network. The
# firewall and `hosts allow` keep it private to the tailnet.
[global]
   server role = standalone server
   map to guest = never
   hosts allow = 100.64.0.0/10 127.0.0.1
   hosts deny = 0.0.0.0/0
   server min protocol = SMB3
   smb encrypt = required
   disable netbios = yes
   smb ports = 445

[{{share_name}}]
   path = {{workspace}}
   valid users = {{owner}}
   read only = no
   browseable = yes
   create mask = 0640
   directory mask = 0750
