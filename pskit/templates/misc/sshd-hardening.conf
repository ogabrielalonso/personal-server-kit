# Managed by pskit (lockdown step). Keys only, the owner only.
# Sorted before 50-cloud-init.conf on purpose: sshd keeps the first value
# it reads, so a provider image cannot turn passwords back on.
PermitRootLogin no
AllowUsers {{owner}}
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
AllowAgentForwarding no
X11Forwarding no
GatewayPorts no
AllowTcpForwarding yes
# Unix-socket forwarding is not limited by per-key permitlisten.
AllowStreamLocalForwarding no
