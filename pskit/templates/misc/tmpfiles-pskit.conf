# Managed by pskit.
# Heavy-job lock (host and brain contract, clause 4): brain batches and
# builds take it so they never peak together.
d /run/pskit 0755 root root -
f /run/pskit/heavy.lock 0664 root {{kit_group}} -
# sshd needs its privilege separation directory to start or validate its
# configuration; with socket activation nothing else creates it at boot.
d /run/sshd 0755 root root -
# Scratch space in the workspace, emptied of anything older than 14 days.
d {{workspace}}/scratch 0750 {{owner}} {{owner_group}} 14d
{{extra_block}}
